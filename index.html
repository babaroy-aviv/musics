<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>מדף המוזיקה</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&family=Assistant:wght@400;500;600;700&display=swap');
  :root{
    --wood-1:#241a22; --wood-2:#17101a;
    --ledge:#3a2a3f; --ledge-2:#241726;
    --paper:#f3eddd; --ink:#211a20; --ink-soft:#5b4d58;
    --gold:#c9a24b; --gold-soft:#e0c88a; --line:#c9b9a0;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{direction:rtl;font-family:'Assistant',system-ui,sans-serif;color:var(--paper);
    background:radial-gradient(120% 80% at 50% -10%, #3a2740 0%, var(--wood-1) 45%, var(--wood-2) 100%);min-height:100vh}
  .wrap{max-width:1060px;margin:0 auto;padding:26px 20px 80px}
  header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
    border-bottom:1px solid rgba(201,162,75,.28);padding-bottom:18px}
  .brand .eyebrow{font-size:12px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase;font-weight:600}
  .brand h1{font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:36px;line-height:1;margin:2px 0 0}
  .brand .count{font-size:13px;color:#b6a2b3;margin-top:6px}
  .top-actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{font-family:'Assistant',sans-serif;font-weight:600;font-size:14px;border:none;border-radius:8px;padding:10px 16px;cursor:pointer;transition:filter .12s,transform .1s}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:#7c2d5a;color:#f6e9f0} .btn-primary:hover{filter:brightness(1.12)}
  .btn-ghost{background:rgba(243,237,221,.08);color:#eaddc9;border:1px solid rgba(201,162,75,.3)}
  .btn-ghost:hover{background:rgba(243,237,221,.14)}
  .btn-quiet{background:transparent;color:#b6a2b3;border:1px solid rgba(182,162,179,.3)}
  .btn:disabled{opacity:.5;cursor:default}

  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 2px 4px}
  .search{flex:1 1 240px;display:flex;gap:8px}
  .search input{flex:1;font-family:'Assistant',sans-serif;font-size:14px;padding:9px 12px;border-radius:8px;
    border:1px solid rgba(201,162,75,.3);background:rgba(243,237,221,.06);color:var(--paper)}
  .search input::placeholder{color:#9c8a99}

  .section{margin-top:22px}
  .sec-head{display:flex;align-items:center;gap:10px;margin:0 4px 12px}
  .sec-head .lbl{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:16px;color:var(--gold-soft)}
  .sec-head .rule{flex:1;height:1px;background:linear-gradient(90deg,rgba(201,162,75,.35),rgba(201,162,75,0))}
  .sec-head .n{font-size:12px;color:#8f7d8c}
  /* cassette rack: thin horizontal spines, packed in columns inside a wooden case */
  .rack{background:linear-gradient(180deg,#2c1e26,#1a1117);border:2px solid #3c2b32;border-radius:7px;
    padding:11px 11px 6px;column-width:216px;column-gap:12px;
    box-shadow:inset 0 3px 12px rgba(0,0,0,.55), 0 8px 20px -10px rgba(0,0,0,.5)}
  .row-empty{color:#8f7d8c;font-size:13px;font-style:italic;padding:20px 8px}
  .tape{break-inside:avoid;display:flex;align-items:stretch;height:27px;margin-bottom:5px;border-radius:3px;overflow:hidden;cursor:pointer;
    background:linear-gradient(180deg,#18171b,#050506);box-shadow:0 1px 2px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);transition:transform .1s}
  .tape:hover{transform:translateX(-3px)}
  .tape:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
  .tape .band{width:6px;flex:0 0 auto}
  .tape .lbl{flex:1;margin:4px 5px;background:#efe6d2;border-radius:2px;display:flex;align-items:center;padding:0 7px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
  .tape .lbl .txt{font-family:'Assistant',sans-serif;font-size:10.5px;font-weight:600;color:#211a20;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tape .lbl .yr{margin-inline-start:auto;font-size:9px;color:#8a7a6a;padding-inline-start:6px;flex:0 0 auto}
  .tape .holes{width:15px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:3px}
  .tape .holes i{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.22)}

  /* designed label cover (when no art) */
  .label-cover{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;position:relative}
  .label-cover .lc-artist{font-family:'Assistant',sans-serif;font-size:9px;letter-spacing:.12em;opacity:.85;text-transform:uppercase}
  .label-cover .lc-title{font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:15px;line-height:1.1;margin-top:4px;color:#fff}
  .label-cover .lc-dot{position:absolute;width:14px;height:14px;border-radius:50%;background:rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.5)}

  .empty{color:#b6a2b3;font-size:15px;padding:30px 12px;border:1px dashed rgba(201,162,75,.35);border-radius:10px;text-align:center}
  .empty b{color:#eaddc9}

  /* overlay */
  .overlay{position:fixed;inset:0;z-index:50;background:rgba(12,7,14,.74);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .card{background:var(--paper);color:var(--ink);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:12px;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.7)}
  .card-head{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
  .card-head h2{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:18px;margin:0}
  .x{background:none;border:none;font-size:24px;cursor:pointer;color:var(--ink-soft);padding:2px 8px;border-radius:6px}
  .x:hover{background:rgba(0,0,0,.06)}
  .card-body{padding:20px}

  /* turntable / player */
  .detail-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(34px) brightness(.45) saturate(1.35);transform:scale(1.2);z-index:0}
  .detail-tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,10,16,.5),rgba(18,10,16,.86));z-index:0}
  .on-cover .card-head{background:transparent;border-bottom-color:rgba(255,255,255,.12)}
  .on-cover .card-head h2, .on-cover .x{color:#f3eddd}
  .detail-content{position:relative;z-index:1}
  #detailBody{position:relative}
  .on-cover .card-body{padding:0}
  .on-cover .detail-content{padding:20px}
  .on-cover{color:#f1e9df}
  .on-cover .p-artist{color:#fff}
  .on-cover .p-title{color:rgba(243,237,221,.78)}
  .on-cover .chip{background:rgba(255,255,255,.14);color:#f1e9df}
  .on-cover .formats button{background:rgba(255,255,255,.1);color:#e9ddcf;border-color:rgba(255,255,255,.18)}
  .on-cover .formats button.on{background:#f3eddd;color:#211a20;border-color:#f3eddd}
  .on-cover .backcard{background:rgba(15,9,14,.5);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:16px 18px;backdrop-filter:blur(6px)}
  .on-cover .tracks .t-head{color:var(--gold-soft);border-bottom-color:rgba(255,255,255,.15)}
  .on-cover .tracks li{color:#eadfd4} .on-cover .tracks li::before{color:rgba(255,255,255,.5)}
  .on-cover .tracks .none{color:rgba(243,237,221,.6)}
  .on-cover .actions{border-top-color:rgba(255,255,255,.14)}
  .on-cover .btn-edit{color:#f3eddd;border-color:rgba(255,255,255,.28)}
  .on-cover .btn-remove{color:#ff9b9b;border-color:rgba(255,155,155,.4)}
  .player{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
  .stage{flex:0 0 260px;position:relative;height:230px;display:flex;align-items:center;justify-content:center;margin:0 auto}
  .disc-cover{position:absolute;right:14px;width:170px;height:170px;border-radius:4px;overflow:hidden;z-index:3;
    box-shadow:0 16px 30px -10px rgba(0,0,0,.5)}
  .disc-cover img{width:100%;height:100%;object-fit:cover;display:block}
  .spin{position:absolute;left:6px;width:186px;height:186px;z-index:2;animation:rot 14s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
  .cassette-wrap{position:absolute;left:0;right:0;display:flex;justify-content:center;z-index:2}

  .info{flex:1 1 300px;min-width:260px}
  .info .p-artist{font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:24px;line-height:1.1;margin:0}
  .info .p-title{font-size:17px;color:var(--ink-soft);margin:2px 0 0}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .chip{font-size:11px;padding:3px 10px;border-radius:20px;background:rgba(0,0,0,.06);color:#4a3d46;letter-spacing:.03em}
  .chip.accent{color:#fff}
  .formats{display:flex;gap:6px;margin-top:14px}
  .formats button{font-family:'Assistant',sans-serif;font-size:12.5px;padding:5px 12px;border-radius:20px;cursor:pointer;border:1px solid var(--line);background:#faf5e9;color:var(--ink-soft)}
  .formats button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  .tracks{margin-top:18px}
  .tracks .t-head{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8a5a7a;font-weight:700;margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:6px}
  .tracks ol{margin:0;padding:0;list-style:none;counter-reset:trk}
  .tracks li{counter-increment:trk;font-size:14px;line-height:1.9;color:#332830;display:flex;gap:10px}
  .tracks li::before{content:counter(trk,decimal-leading-zero);color:#b09;color:#a88;font-variant-numeric:tabular-nums;color:#9a8794;min-width:22px}
  .tracks .none{font-size:13px;color:#8a7a86;font-style:italic}

  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
  .btn-open{background:var(--ink);color:var(--paper)} .btn-open:hover{filter:brightness(1.3)}
  .btn-edit{background:transparent;color:var(--ink);border:1px solid var(--line)} .btn-edit:hover{background:rgba(0,0,0,.05)}
  .btn-remove{background:transparent;color:#a23; border:1px solid rgba(170,34,51,.35);margin-inline-start:auto}

  /* form */
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:4px}
  input[type=text],textarea{width:100%;font-family:'Assistant',sans-serif;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#faf5e9;color:var(--ink)}
  textarea{min-height:90px;resize:vertical;line-height:1.6}
  .two{display:flex;gap:10px;flex-wrap:wrap}.two .field{flex:1 1 170px}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{font-size:13px;padding:7px 13px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:#faf5e9;color:var(--ink-soft);font-weight:600}
  .seg button.on{background:#7c2d5a;color:#f6e9f0;border-color:#7c2d5a}
  .search-row{display:flex;gap:8px;flex-wrap:wrap}.search-row input{flex:1 1 200px}
  .status{font-size:13px;min-height:18px;color:var(--ink-soft);margin:4px 0 8px}
  .status.err{color:#a23}.status.ok{color:#3f6b3a}
  .results{display:flex;flex-direction:column;gap:6px;margin:2px 0 10px;max-height:300px;overflow:auto}
  .res{display:flex;gap:10px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:#faf5e9}
  .res:hover{background:#f0e7d5}
  .res img{width:46px;height:46px;border-radius:4px;object-fit:cover;flex:0 0 auto;background:#e6dcc4}
  .res .rmeta{flex:1;min-width:0}
  .res .rt{font-weight:700;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .res .ra{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .form-actions{display:flex;gap:8px;margin-top:8px;padding-top:14px;border-top:1px solid var(--line)}
  .ltr{direction:ltr;text-align:left}
  @media (max-width:560px){.brand h1{font-size:28px}.stage{flex-basis:100%}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="eyebrow">אוסף התקליטים שלי</span>
      <h1>מדף המוזיקה</h1>
      <span class="count" id="count">—</span>
    </div>
    <div class="top-actions">
      <button class="btn btn-primary" id="addBtn">+ הוסף אלבום</button>
      <button class="btn btn-ghost" id="exportBtn">גיבוי</button>
      <button class="btn btn-quiet" id="importBtn">שחזור</button>
      <input type="file" id="importFile" accept="application/json" hidden />
    </div>
  </header>

  <div class="toolbar">
    <div class="search">
      <input type="text" id="artistSearch" placeholder="חיפוש לפי אמן או אלבום…" />
      <button class="btn btn-quiet" id="clearSearch">נקה</button>
    </div>
    <button class="btn btn-ghost" id="grabAll">משוך עטיפות לכל האוסף</button>
  </div>

  <div id="shelves"></div>
</div>

<!-- detail / player -->
<div class="overlay" id="detailOverlay"><div class="card">
  <div class="card-head"><h2 id="dHead">&nbsp;</h2><button class="x" data-close>&times;</button></div>
  <div class="card-body" id="detailBody"></div>
</div></div>

<!-- add / edit -->
<div class="overlay" id="formOverlay"><div class="card">
  <div class="card-head"><h2 id="formTitle">הוסף אלבום</h2><button class="x" data-close>&times;</button></div>
  <div class="card-body">
    <div class="field"><label>חיפוש ברשת — שם אלבום או אמן</label>
      <div class="search-row"><input type="text" id="q" placeholder="לדוגמה: Led Zeppelin IV" />
        <button class="btn btn-primary" id="searchBtn">חפש ומלא</button></div>
    </div>
    <div class="status" id="searchStatus"></div>
    <div class="results" id="searchResults"></div>
    <div class="field"><label>סגנון (מדף)</label>
      <div class="seg" id="styleSeg">
        <button type="button" data-style="israeli">ישראלי</button>
        <button type="button" data-style="english">אנגלית / לועזי</button>
        <button type="button" data-style="instrumental">ללא מילים</button>
      </div>
    </div>
    <div class="two">
      <div class="field"><label>אמן</label><input type="text" id="artist" /></div>
      <div class="field"><label>שם האלבום</label><input type="text" id="title" /></div>
    </div>
    <div class="two">
      <div class="field" style="flex:0 0 110px"><label>שנה</label><input type="text" id="year" inputmode="numeric" /></div>
      <div class="field"><label>ז'אנר (מהרשת)</label><input type="text" id="genre" /></div>
      <div class="field"><label>תקופה</label><input type="text" id="era" placeholder="שנות ה-70…" /></div>
    </div>
    <div class="field"><label>קישור לעטיפה</label><input type="text" id="coverUrl" class="ltr" placeholder="https://..." /></div>
    <div class="field"><label>רשימת שירים (שורה לכל שיר)</label><textarea id="tracks" placeholder="שיר 1&#10;שיר 2&#10;..."></textarea></div>
    <div class="form-actions"><button class="btn btn-primary" id="saveBtn">שמור למדף</button><button class="btn btn-edit" data-close>ביטול</button></div>
  </div>
</div></div>

<script>
(function(){
  "use strict";
  /* storage */
  var mem={}, hasStore=!!(window.storage&&window.storage.get);
  var hasLS=(function(){try{var k="__m_t";localStorage.setItem(k,"1");localStorage.removeItem(k);return true;}catch(e){return false;}})();
  async function sget(k){if(hasStore){try{var r=await window.storage.get(k);return r?r.value:null;}catch(e){}}if(hasLS){try{return localStorage.getItem(k);}catch(e){}}return (k in mem)?mem[k]:null;}
  async function sset(k,v){if(hasStore){try{await window.storage.set(k,v);return;}catch(e){}}if(hasLS){try{localStorage.setItem(k,v);return;}catch(e){}}mem[k]=v;}
  async function sdel(k){if(hasStore){try{await window.storage.delete(k);return;}catch(e){}}if(hasLS){try{localStorage.removeItem(k);return;}catch(e){}}delete mem[k];}
  /* scalable store: one key, cached in memory (ready for ~1000 albums) */
  var DBKEY="music:db", DB=[], dbLoaded=false, saveT=null;
  async function loadDB(){
    if(dbLoaded) return DB;
    var raw=await sget(DBKEY);
    if(raw){ try{DB=JSON.parse(raw)||[];}catch(e){DB=[];} }
    else { // one-time migration from old per-key format
      var idxRaw=await sget("music:index");
      if(idxRaw){ try{ var idx=JSON.parse(idxRaw)||[]; for(var i=0;i<idx.length;i++){ var r=await sget("music:album:"+idx[i]); if(r){ try{DB.push(JSON.parse(r));}catch(e){}} } }catch(e){} if(DB.length) await persistDB(); }
    }
    DB.forEach(function(a){ if(!a.style)a.style="english"; });
    dbLoaded=true; return DB;
  }
  async function persistDB(){ await sset(DBKEY, JSON.stringify(DB)); }
  function persistSoon(){ clearTimeout(saveT); saveT=setTimeout(persistDB,300); }
  async function getAlbum(id){ await loadDB(); for(var i=0;i<DB.length;i++) if(DB[i].id===id) return DB[i]; return null; }
  async function saveAlbum(a){ await loadDB(); var i=-1; for(var k=0;k<DB.length;k++) if(DB[k].id===a.id){i=k;break;} if(i>=0)DB[i]=a; else DB.push(a); await persistDB(); }
  async function removeAlbum(id){ await loadDB(); DB=DB.filter(function(a){return a.id!==id;}); await persistDB(); }
  async function allAlbums(){ await loadDB(); return DB.slice(); }

  /* helpers */
  function $(s){return document.querySelector(s);}
  function el(t,c){var e=document.createElement(t);if(c)e.className=c;return e;}
  function uid(){return "m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
  function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function isHeb(s){return /[\u0590-\u05FF]/.test(s||"");}
  function hslToHex(h,s,l){s/=100;l/=100;var a=s*Math.min(l,1-l);var f=function(n){var k=(n+h/30)%12;var c=l-a*Math.max(Math.min(k-3,9-k,1),-1);return Math.round(255*c).toString(16).padStart(2,"0");};return "#"+f(0)+f(8)+f(4);}
  function hueHash(str){var h=0;str=str||"x";for(var i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))>>>0;return h%360;}
  function sig(a){ if(a.color)return a.color; return hslToHex(hueHash((a.artist||"")+(a.title||a.id)),60,47); }
  function shade(hex,amt){var c=hex.replace("#","");if(c.length===3)c=c.split("").map(function(x){return x+x;}).join("");var n=parseInt(c,16),r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return "rgb("+r+","+g+","+b+")";}
  function toRgb(hex){hex=(hex||"").replace("#","");if(hex.length===3)hex=hex.split("").map(function(c){return c+c;}).join("");var n=parseInt(hex,16);if(isNaN(n))return {r:120,g:100,b:90};return {r:(n>>16)&255,g:(n>>8)&255,b:n&255};}
  function rgbToHex(r,g,b){function h(x){x=Math.max(0,Math.min(255,Math.round(x)));var s=x.toString(16);return s.length<2?"0"+s:s;}return "#"+h(r)+h(g)+h(b);}
  function tapeText(hex){var c=toRgb(hex);var l=(0.299*c.r+0.587*c.g+0.114*c.b)/255;return l>0.58?"#201a1e":"#f6efe2";}
  // dominant colour of a cover image (works for embedded/base64 and CORS-enabled covers)
  function dominantColor(url){
    return new Promise(function(resolve){
      try{
        var img=new Image(); var src=url;
        if(!/^data:/.test(url)){ img.crossOrigin="anonymous"; src="https://wsrv.nl/?url="+encodeURIComponent(url)+"&w=72&output=jpg"; }
        img.onload=function(){
          try{
            var s=32,cv=document.createElement("canvas");cv.width=s;cv.height=s;var ctx=cv.getContext("2d");ctx.drawImage(img,0,0,s,s);
            var d=ctx.getImageData(0,0,s,s).data,map={},bestK=null,bestC=0,ar=0,ag=0,ab=0,an=0;
            for(var i=0;i<d.length;i+=4){var R=d[i],G=d[i+1],B=d[i+2];if(d[i+3]<128)continue;ar+=R;ag+=G;ab+=B;an++;

  /* iTunes via JSONP (bypasses CORS; no iTunes app needed) */
  function jsonp(url){

      var s=document.createElement("script");
      var t=setTimeout(function(){cleanup();reject(new Error("timeout"));},9000);
      function cleanup(){clearTimeout(t);try{delete window[cb];}catch(e){window[cb]=undefined;}if(s.parentNode)s.parentNode.removeChild(s);}
      window[cb]=function(data){cleanup();resolve(data);};
      s.onerror=function(){cleanup();reject(new Error("neterr"));};
      s.src=url+(url.indexOf("?")>=0?"&":"?")+"callback="+cb;
      document.body.appendChild(s);
    });
  }
  async function itunesSearch(q){

      return (d.results||[]).filter(function(x){return x.wrapperType==="track";}).sort(function(a,b){return (a.trackNumber||0)-(b.trackNumber||0);}).map(function(x){return x.trackName;});
    }catch(e){return[];}

    rd.onload=async function(){try{var data=JSON.parse(rd.result);var albums=data.albums||data;if(!Array.isArray(albums))throw 0;
      for(var i=0;i<albums.length;i++){var a=albums[i];if(!a.id)a.id=uid();if(!a.style)a.style="english";await saveAlbum(a);}
      render();alert("שוחזרו "+albums.length+" אלבומים.");}catch(err){alert("קובץ לא תקין.");}$("#importFile").value="";};
    rd.readAsText(f);
  });

  /* overlay plumbing */
  function showOverlay(o){o.classList.add("show");}
  function closeOverlay(o){o.classList.remove("show");}
  Array.prototype.forEach.call(document.querySelectorAll("[data-close]"),function(b){b.addEventListener("click",function(){closeOverlay(b.closest(".overlay"));});});
  Array.prototype.forEach.call(document.querySelectorAll(".overlay"),function(o){o.addEventListener("mousedown",function(e){if(e.target===o)closeOverlay(o);});});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")Array.prototype.forEach.call(document.querySelectorAll(".overlay.show"),closeOverlay);});
